<style>
/* Layout: a working register. Navy masthead from the workbook header, a sticky tab and filter bar,
   then one sheet at a time as a ruled table that folds into cards at phone width. Chinese runs in
   the workbook's blue under every English line. */
:root {
  --paper: #f3f5f8;
  --surface: #ffffff;
  --sunk: #e9edf2;
  --ink: #142231;
  --muted: #566474;
  --rule: #d3dae2;
  --navy: #1f3864;
  --navy-ink: #ffffff;
  --navy-muted: #b9c6dc;
  --zh: #0067b3;
  --link: #1d4f9c;
  --focus: #2a6fd6;
  --hl: #fff2cc;
  --st-new: #66727f;
  --st-design: #2a66b0;
  --st-decided: #2b7a4b;
  --st-hasa: #8c5d00;
  --st-disc: #b5480c;
  --st-wait: #6447b0;
  --st-drop: #8a8f95;
  --f-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --f-zh: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "IBM Plex Sans", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --step--1: 0.8125rem;
  --step-0: 0.9375rem;
  --step-1: 1.125rem;
  --step-2: 1.5rem;
  --step-3: 2rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e141b; --surface: #151d26; --sunk: #1c2632; --ink: #e2e8ef; --muted: #9babbb;
    --rule: #2a3744; --navy: #172742; --navy-ink: #eef3fb; --navy-muted: #9fb0cc; --zh: #73b6f2;
    --link: #93b9ff; --focus: #7aa8ff; --hl: #3a3219;
    --st-new: #9aa6b2; --st-design: #6ea4ec; --st-decided: #5fc08a; --st-hasa: #e0b04a;
    --st-disc: #f08a4b; --st-wait: #a68ff0; --st-drop: #8f959c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e141b; --surface: #151d26; --sunk: #1c2632; --ink: #e2e8ef; --muted: #9babbb;
  --rule: #2a3744; --navy: #172742; --navy-ink: #eef3fb; --navy-muted: #9fb0cc; --zh: #73b6f2;
  --link: #93b9ff; --focus: #7aa8ff; --hl: #3a3219;
  --st-new: #9aa6b2; --st-design: #6ea4ec; --st-decided: #5fc08a; --st-hasa: #e0b04a;
  --st-disc: #f08a4b; --st-wait: #a68ff0; --st-drop: #8f959c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: var(--step-0);
  line-height: 1.5; margin: 0;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30;
  background: var(--navy);
}
a { color: var(--link); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, tr:focus-visible, .card:focus-visible {
  outline: 2px solid var(--focus); outline-offset: 2px;
}
.wrap {
  max-width: 1440px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.zh { color: var(--zh); font-family: var(--f-zh); font-size: 0.94em; display: block; margin-top: 0.15em; }
body[data-lang="en"] .zh, body[data-lang="en"] .zh-solo { display: none; }
body[data-lang="zh"] .en, body[data-lang="zh"] .en-both { display: none; }
body[data-lang="zh"] .zh { margin-top: 0; }
body:not([data-lang="zh"]) .zh-solo { display: none; }
.en { display: block; }
.inl .en, .inl .zh { display: inline; }
.inl .zh::before { content: " / "; color: var(--muted); }
body[data-lang="zh"] .inl .zh::before, body[data-lang="en"] .inl .zh::before { content: ""; }

/* Masthead */
.mast { background: var(--navy); color: var(--navy-ink); }
.mast .wrap { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 32px; padding-block: 22px 18px; }
.mast .eyebrow { font-family: var(--f-mono); font-size: var(--step--1); letter-spacing: 0.06em; color: var(--navy-muted); text-transform: uppercase; }
.mast h1 { font-family: var(--f-display); font-stretch: 85%; font-weight: 700; font-size: var(--step-3); line-height: 1.05; margin: 4px 0 0; text-wrap: balance; letter-spacing: -0.01em; }
.mast h1 .zh { color: var(--navy-muted); font-size: 0.55em; font-weight: 500; margin-top: 6px; letter-spacing: 0; }
.mast .meta { font-size: var(--step--1); color: var(--navy-muted); text-align: right; display: grid; gap: 2px; }
.mast .meta strong { color: var(--navy-ink); font-family: var(--f-mono); font-weight: 600; }

/* Sticky bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--rule); }
.bar .row1 { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  appearance: none; border: 0; background: none; color: var(--muted); cursor: pointer; white-space: nowrap;
  font-family: var(--f-display); font-stretch: 90%; font-weight: 600; font-size: var(--step-0);
  padding: 14px 12px 12px; border-bottom: 3px solid transparent;
}
.tab .n { font-family: var(--f-mono); font-size: var(--step--1); font-weight: 500; margin-left: 6px; color: var(--muted); }
.tab .tz { font-family: var(--f-zh); font-weight: 500; font-size: 0.85em; margin-left: 6px; color: var(--zh); }
body[data-lang="en"] .tab .tz { display: none; }
body[data-lang="zh"] .tab .te { display: none; }
body[data-lang="zh"] .tab .tz { margin-left: 0; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--navy); }
:root[data-theme="dark"] .tab[aria-selected="true"] { border-bottom-color: var(--link); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tab[aria-selected="true"] { border-bottom-color: var(--link); } }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; flex: none; }
.seg button { appearance: none; border: 0; background: var(--surface); color: var(--muted); font: 500 var(--step--1) var(--f-body); padding: 6px 10px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.filters { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 12px; padding-block: 10px 12px; border-top: 1px solid var(--rule); }
.filters[hidden] { display: none !important; }
.f { display: grid; gap: 2px; min-width: 0; }
.f label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
.f select, .f input {
  font: 400 var(--step--1) var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--rule);
  border-radius: 6px; padding: 6px 8px; min-width: 0; max-width: 100%;
}
.f.search { flex: 1 1 220px; }
.f.search input { width: 100%; }
.clear { appearance: none; border: 1px solid var(--rule); background: var(--sunk); color: var(--ink); border-radius: 6px; padding: 6px 10px; font: 500 var(--step--1) var(--f-body); cursor: pointer; }
.count { font-size: var(--step--1); color: var(--muted); margin-left: auto; align-self: center; font-variant-numeric: tabular-nums; }
.ftoggle { display: none; }

main { padding-block: 20px 64px; }
.view[hidden] { display: none !important; }
.lede { max-width: 72ch; color: var(--muted); margin: 0 0 16px; font-size: var(--step--1); }

/* Register table */
.tbl-wrap { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
table.reg { width: 100%; border-collapse: collapse; table-layout: fixed; }
.reg th {
  text-align: left; vertical-align: bottom; font-size: 0.75rem; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--rule); background: var(--sunk);
}
.reg th .zh { text-transform: none; letter-spacing: 0; font-weight: 500; }
.reg td { vertical-align: top; padding: 12px; border-bottom: 1px solid var(--rule); font-size: var(--step--1); overflow-wrap: anywhere; }
.reg tbody tr { cursor: pointer; }
.reg tbody tr:hover td { background: color-mix(in srgb, var(--sunk) 60%, transparent); }
.reg tbody tr:last-child td { border-bottom: 0; }
.reg tr.grp td { background: var(--paper); cursor: default; padding: 8px 12px; font-family: var(--f-display); font-stretch: 90%; font-weight: 600; font-size: var(--step--1); color: var(--muted); letter-spacing: 0.02em; }
.reg tr.grp:hover td { background: var(--paper); }
.id { font-family: var(--f-mono); font-weight: 600; font-size: var(--step--1); white-space: nowrap; color: var(--ink); }
.ttl { font-weight: 600; font-size: var(--step-0); line-height: 1.35; }
.ttl .zh { font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; font-size: 0.72rem; line-height: 1.3; padding: 2px 7px;
  border-radius: 4px; background: var(--sunk); color: var(--muted); font-weight: 500;
}
.chip .zh { display: inline; margin: 0; font-size: 1em; }
body[data-lang="both"] .chip .zh::before { content: "· "; color: var(--muted); }
.st { --c: var(--st-new); color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); font-weight: 600; }
.st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); flex: none; }
.st[data-s="In design"] { --c: var(--st-design); }
.st[data-s="Decided"], .st[data-s="Decided go"] { --c: var(--st-decided); }
.st[data-s="Awaiting HASA confirmation"] { --c: var(--st-hasa); }
.st[data-s="Needs discussion"] { --c: var(--st-disc); }
.st[data-s="Waiting on test"], .st[data-s="Test running"] { --c: var(--st-wait); }
.st[data-s="Dropped"], .st[data-s="Decided no-go"] { --c: var(--st-drop); }
.owner { margin-top: 6px; font-size: 0.78rem; color: var(--muted); }
.ref { font-family: var(--f-mono); font-size: 0.78rem; line-height: 1.55; }
.ref .zh { font-family: var(--f-zh); }
a.xref { font-family: var(--f-mono); font-weight: 600; font-size: 0.95em; white-space: nowrap; }
.empty { padding: 32px 16px; text-align: center; color: var(--muted); }

/* Detail drawer */
.scrim { position: fixed; inset: 0; background: rgb(8 14 22 / 0.45); z-index: 40; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%); z-index: 41; background: var(--surface);
  border-left: 1px solid var(--rule); display: flex; flex-direction: column; box-shadow: -12px 0 32px rgb(0 0 0 / 0.18);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-right: env(safe-area-inset-right, 0px);
  transform: translateX(0); transition: transform 0.18s ease-out;
}
.drawer .dh { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--rule); background: var(--sunk); }
.drawer .dh .id { font-size: var(--step-1); }
.drawer .dh .sheet { font-size: var(--step--1); color: var(--muted); }
.drawer .dh .sp { flex: 1; }
.icon-btn { appearance: none; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 5px 10px; font: 500 var(--step--1) var(--f-body); cursor: pointer; }
.icon-btn:disabled { opacity: 0.4; cursor: default; }
.drawer .db { overflow-y: auto; padding: 18px 20px 40px; overscroll-behavior: contain; }
.drawer h2 { font-family: var(--f-display); font-stretch: 88%; font-weight: 700; font-size: var(--step-2); line-height: 1.15; margin: 0 0 10px; text-wrap: balance; }
.drawer h2 .zh { font-size: 0.68em; font-weight: 500; margin-top: 6px; }
.fields { display: grid; gap: 0; margin-top: 18px; border-top: 1px solid var(--rule); }
.fld { display: grid; grid-template-columns: 11rem minmax(0, 1fr); gap: 4px 16px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.fld > .k { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; }
.fld > .k .zh { text-transform: none; letter-spacing: 0; font-weight: 500; }
.fld > .v { font-size: var(--step-0); min-width: 0; overflow-wrap: anywhere; }
.fld > .v.blank { color: var(--muted); font-style: italic; font-size: var(--step--1); }
.linkgrp { margin-top: 18px; }
.linkgrp h3 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.linklist { display: flex; flex-wrap: wrap; gap: 6px; }
.lk { display: inline-flex; gap: 6px; align-items: baseline; border: 1px solid var(--rule); border-radius: 6px; padding: 5px 9px; font-size: var(--step--1); text-decoration: none; background: var(--surface); }
.lk:hover { border-color: var(--link); }
.lk .kind { font-family: var(--f-mono); font-size: 0.68rem; text-transform: uppercase; color: var(--muted); }
.lk .zh { display: inline; margin: 0; }
body[data-lang="both"] .lk .zh::before { content: " / "; color: var(--muted); }
.note { font-size: var(--step--1); color: var(--muted); margin-top: 18px; }

/* Read me */
.rm { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 24px 24px; max-width: 1040px; }
.rm h3 { font-family: var(--f-display); font-stretch: 90%; font-weight: 700; font-size: var(--step-1); margin: 26px 0 6px; padding-bottom: 6px; border-bottom: 2px solid var(--ink); }
.rm h3 .zh { display: inline; font-size: 0.8em; margin-left: 10px; font-weight: 500; }
body[data-lang="zh"] .rm h3 .zh { margin-left: 0; }
.rm dl { margin: 0; display: grid; grid-template-columns: 14rem minmax(0, 1fr); }
.rm dt, .rm dd { padding: 10px 0; border-bottom: 1px solid var(--rule); margin: 0; }
.rm dt { font-weight: 600; padding-right: 16px; font-size: var(--step--1); }
.rm dd { max-width: 78ch; }

/* Gates */
.gates { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 16px; }
.gate { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 18px 20px; min-width: 0; }
.gate h3 { font-family: var(--f-display); font-stretch: 90%; font-weight: 700; font-size: var(--step-1); margin: 0 0 4px; }
.gate h3 .zh { font-weight: 500; font-size: 0.8em; }
.gate .gk { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; margin-top: 12px; }
.gate .gv { font-size: var(--step--1); margin-top: 2px; }
.gate .ids { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 4px; }

/* Summary */
.sum { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 16px; align-items: start; }
.sum section { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; min-width: 0; }
.sum h3 { font-family: var(--f-display); font-stretch: 90%; font-weight: 700; font-size: var(--step-0); margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--rule); background: var(--sunk); }
.sum h3 .zh { display: inline; margin-left: 8px; font-weight: 500; }
body[data-lang="zh"] .sum h3 .zh { margin-left: 0; }
.sum table { width: 100%; border-collapse: collapse; font-size: var(--step--1); }
.sum td, .sum th { padding: 8px 14px; border-bottom: 1px solid var(--rule); text-align: left; }
.sum th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; }
.sum td.n, .sum th.n { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--f-mono); width: 6.5rem; }
.sum tr.tot td { font-weight: 700; border-top: 2px solid var(--ink); }
.sum tr:last-child td { border-bottom: 0; }
.sum td .zh { display: inline; margin-left: 6px; }
body[data-lang="zh"] .sum td .zh { margin-left: 0; }
.zero { color: var(--muted); }

/* References */
.refs { display: grid; gap: 10px; max-width: 1100px; }
.refrow { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 18px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 18px; align-items: start; }
.refrow h3 { margin: 0; font-size: var(--step-0); font-weight: 600; }
.refrow h3 .zh { font-weight: 500; }
.refrow .desc { font-size: var(--step--1); color: var(--muted); }
.refrow .cited { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: var(--step--1); grid-column: 1 / -1; }
.refrow .cited .lbl { color: var(--muted); }
.open { white-space: nowrap; font-weight: 600; font-size: var(--step--1); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 10px; text-decoration: none; display: inline-flex; gap: 6px; align-items: baseline; }
.open .kind { font-family: var(--f-mono); font-size: 0.68rem; text-transform: uppercase; color: var(--muted); }
.refs h2, .sec-h { font-family: var(--f-display); font-stretch: 90%; font-weight: 700; font-size: var(--step-1); margin: 18px 0 4px; }

/* Column widths, desktop */
.go-tbl col.c-id { width: 6.5rem; } .go-tbl col.c-t { width: 22%; } .go-tbl col.c-ref { width: 9.5rem; } .go-tbl col.c-st { width: 10rem; }
.nt-tbl col.c-id { width: 6.5rem; } .nt-tbl col.c-t { width: 20%; } .nt-tbl col.c-need { width: 9rem; }

@media (max-width: 1100px) {
  .go-tbl .c-showed, .nt-tbl .c-hold { display: none; }
}
@media (max-width: 760px) {
  :root { --step-3: 1.6rem; --step-2: 1.3rem; }
  .mast .meta { text-align: left; }
  .ftoggle { display: inline-flex; }
  .filters.collapsed .f:not(.search), .filters.collapsed .clear { display: none; }
  .count { margin-left: 0; }
  table.reg, .reg tbody { display: block; }
  .reg colgroup, .reg thead { display: none; }
  .reg tbody tr { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; padding: 12px 14px; border-bottom: 1px solid var(--rule); }
  .reg tbody tr:last-child { border-bottom: 0; }
  .reg td { display: block; padding: 0; border: 0; }
  .reg td.c-xs-hide { display: none; }
  .reg td.c-t { grid-column: 1 / -1; }
  .reg td.c-st { grid-column: 2; grid-row: 1; justify-self: end; }
  .reg td.c-st .owner { display: none; }
  .reg tr.grp { display: block; padding: 8px 14px; background: var(--paper); }
  .reg tr.grp td { padding: 0; }
  .fld { grid-template-columns: 1fr; }
  .rm { padding: 4px 16px 16px; }
  .rm dl { grid-template-columns: 1fr; }
  .rm dt { border-bottom: 0; padding-bottom: 0; }
  .refrow { grid-template-columns: 1fr; }
  .drawer .db { padding: 16px 16px 40px; }
  .drawer .dh .sheet { display: none; }
  .drawer .dh { padding: 10px 12px; gap: 6px; }
}
@media (prefers-reduced-motion: reduce) { .drawer { transition: none; } }
</style>

<header class="mast">
  <div class="wrap">
    <div>
      <div class="eyebrow">HCG-50 · DVT2, the 20-unit build</div>
      <h1>Design change tracker<span class="zh">DVT2设计变更跟踪表</span></h1>
    </div>
    <div class="meta">
      <div><strong id="ver"></strong> · <span id="date"></span></div>
      <div><span class="en-both">Read-only. HSW edits the Excel copy.</span><span class="zh-solo">只读页面。HSW请在Excel版本中修改。</span></div>
    </div>
  </div>
</header>

<div class="bar">
  <div class="wrap">
    <div class="row1">
      <nav class="tabs" role="tablist" aria-label="Sheets" id="tabs"></nav>
      <div class="seg" role="group" aria-label="Language" id="langseg">
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
        <button type="button" data-lang="zh" aria-pressed="false">中文</button>
        <button type="button" data-lang="both" aria-pressed="true">Both</button>
      </div>
    </div>
    <div class="filters collapsed" id="filters">
      <div class="f search"><label for="q">Search · 搜索</label><input id="q" type="search" placeholder="NB-05, venturi, 文丘里…" autocomplete="off"></div>
      <div class="f"><label for="fa">Area · 领域</label><select id="fa"></select></div>
      <div class="f"><label for="fe">Evidence · 依据来源</label><select id="fe"></select></div>
      <div class="f"><label for="fs">Status · 状态</label><select id="fs"></select></div>

   "showed": {
    "en": "M26 asks for one connection type at the water inlet and outlet. DVT1 mixes standards. IN and OUT ship with 16 mm compression fittings on 14 × 16 mm tube, plus a 4 × 6 mm drain tube. The kit adapters are ½ in NPT and the spares are G½ BSPP. The tank bosses use Chinese 2分, 4分 and 6分 sizes with no thread standard named, and the heatsink fittings are ¼ in NPT. US installs have hit 16 mm tube against ½ in US fittings, and BSPP against NPT.",
    "zh": "M26要求进水口和出水口采用同一种连接方式。DVT1混用了多种标准。进水口和出水口出货时都是16 mm卡套接头，配14 × 16 mm管，另有一根4 × 6 mm排水管。配件包里的转接头是½ in NPT，备件是G½ BSPP。水箱凸台采用国内的2分、4分、6分规格，没有注明螺纹标准；散热片接头是¼ in NPT。美国安装时遇到过16 mm管配½ in美标接头、BSPP配NPT的问题。"

    "zh": "技术人员会接触的每个维护接口都采用美标NPT螺纹和英制管。公制管和接头在美国很难买到，外观相似的不同螺纹标准也容易混淆。液位线以下的水箱壁开孔仍采用焊接或模具成型，见NB-02。英制管用的快插接头仍满足M26。"

    "zh": "DVT1的滤芯型号没有任何书面记录。CAD只给出尺寸（活性炭和树脂滤芯Ø119 × 280 mm，RO膜壳Ø87 × 310 mm），BOM中也没有列出滤芯。DVT1装的是活性炭、树脂和RO三种滤芯。RT30手册规定的是阻垢滤芯和RO膜。美国现场需要能在当地买到的替换件。"

  {
   "id": "NB-14a",
   "area": {
    "en": "Tank and water path",
    "zh": "水箱与水路"
   },
   "title": {
    "en": "Venturi sized by calculation to the DVT2 booster pump",
    "zh": "按DVT2增压水泵计算选定文丘里管尺寸"
   },
   "showed": {
    "en": "DVT1 output ran 30 to 40% below the demo. The DVT1 venturi bore was 2 mm smaller. After HSW changed the venturi and outlet tube to match the demo, the retest passed (M34). The venturi lengths disagree across records: 147 mm appears only in M37, SWC's 24 June notes give 140 and 143 mm, and the CAD gives 142 mm.",
    "zh": "DVT1的产氯量比Demo样机低30%到40%。DVT1文丘里管孔径小了2 mm。HSW将文丘里管和出口管改成与Demo样机一致后，复测通过（M34）。各记录中的文丘里管长度不一致：147 mm只出现在M37中，SWC 6月24日的记录为140和143 mm，CAD中为142 mm。"
   },
   "evidence": {
    "en": "HSW bench and rooftop pool",
    "zh": "HSW台架及楼顶泳池测试"
   },
   "start": {
    "en": "Size the venturi with SWC's DVT2 hydraulic model, called the venturi sizing model until V0.2. It is a separate workbook that SWC revises as the design settles. It works out all the liquid and gas the venturi must carry at the DVT2 booster pump's operating point, with margin for efficiency loss over time. The venturi and booster specs in this row come from the model's current version.",
    "zh": "用SWC的DVT2综合水力模型确定文丘里管尺寸，该模型在V0.2之前称为文丘里管选型计算模型。它是单独的工作簿，SWC会随设计推进不断修订。模型按DVT2增压水泵的工作点，计算文丘里管必须输送的全部液体和气体，并为长期效率下降留出余量。本行中的文丘里管和增压水泵规格取自模型的当前版本。"
   },
   "details": {
    "en": "Spec state: Not finalized. Current selection, from model V0.3 of 22 October: a Mazzei 0484X injector or the same geometry, in PVDF. The design pool-line pressure is settled at 260 kPa at the OUT tap, enough for the pool pump at shut-off, so no cleaning or spa program pauses generation (Alex, 22 October). At that pressure and 25% derating, with the brine overflow counted, the DVT2 booster must deliver at least 17.6 L/min at 32.8 m. Line pressure plus booster head then reaches about 580 kPa, so every part from the booster to the venturi needs a rating above the chosen booster's shut-off pressure plus 260 kPa. Before the spec moves to Locked in, SWC and HSW settle the derating, whether the overflow (NB-07) and H₂ (NB-15a) count toward the sizing, and a part that can be sourced and fits the DVT2 size and material criteria. Then the part number goes in the BOM. The locked spec also gives the suction vacuum target at the pump's generate speed.",
    "zh": "规格状态：未定稿 (Not finalized)。当前选型，取自10月22日的模型V0.3：Mazzei 0484X射流器或相同几何尺寸，材质PVDF。设计泳池管路压力已确定为OUT接口处260 kPa，足以覆盖泳池泵关断压力，因此任何清洁或按摩池程序都不会使制氯暂停（Alex，10月22日）。在该压力、降额25%并计入盐水溢流时，DVT2增压水泵至少需要提供17.6 L/min、扬程32.8 m。此时管路压力加水泵扬程约为580 kPa，因此从增压水泵到文丘里管的所有零件，额定压力都须高于所选水泵的关断压力加260 kPa。规格转为已锁定 (Locked in) 之前，SWC和HSW需要确定降额，确定溢流（NB-07）和H₂（NB-15a）是否计入选型，并找到可采购、且符合DVT2尺寸和材料要求的零件。然后将型号写入BOM。锁定后的规格还会给出水泵制氯转速下的吸入负压目标值。"
   },
   "refine": {
    "en": "The pump choice, NB-37. Bench vacuum measurements, including shut-off vacuum in the drain bench plan, step 3, and suction against back-pressure up to 260 kPa with the chosen booster, since the design point is beyond Mazzei's printed tables. Inputs the model still lacks: pool-line pressure at the IN and OUT taps on a real pad, the as-built venturi bores and material, and flow meter A checked against a bucket. Each new model version updates the current selection.",
    "zh": "水泵选型，NB-37。台架负压测量，包括排碱台架测试计划第3步中的关断负压，以及用选定的增压水泵在最高260 kPa背压下测量吸入能力，因为设计点已超出Mazzei性能表的范围。模型尚缺的输入：实际安装现场IN和OUT接口的泳池管路压力，实物文丘里管的内径和材料，以及用水桶计时法校核流量计A。模型每出一个新版本，就更新当前选型。"
   },

    "en": "M34, M37 · HCG-335",
    "zh": ""

    "zh": "何叶锋"

  {
   "id": "NB-15a",
   "area": {
    "en": "Tank and water path",
    "zh": "水箱与水路"
   },
   "title": {
    "en": "Plastic valve bodies. Gas-line valves cut from three, keeping a separate H₂ valve",
    "zh": "所有阀门标准化为塑料阀体；气体管线球阀简化，保留单独的氢气阀"
   },
   "showed": {
    "en": "HSW lists the DVT1 water-inlet ball valve as stainless while every other valve is plastic (E32, DFMEA 14), and proposes cutting the gas-line valves from three to one (E37). SWC's own records disagree on whether DVT1 still has the stainless inlet valve and all three gas-line valves. Photos of the valves on a unit will settle both. On DVT1, Cl₂ reaches the venturi T through the mixing column and valve B, H₂ goes through valve C, and caustic through valve D. The operating-states spec closes valve C during a drain, which argues for keeping a separate H₂ valve.",
    "zh": "HSW记录DVT1进水电动球阀为不锈钢阀体，其他阀门都是塑料阀体（E32，DFMEA 14），并建议将气体管线阀门从3个减为1个（E37）。对于DVT1是否仍装有不锈钢进水阀、是否仍有3个气体管线阀门，SWC自己的记录说法不一。拍摄一台设备上的阀门照片即可确认这两点。DVT1上，Cl₂经混合柱和电动球阀B到达文丘里管三通，H₂经电动球阀C，碱液经电动球阀D。运行状态规范要求排碱时关闭电动球阀C，这说明应保留单独的氢气阀。"
   },
   "evidence": {
    "en": "DVT1 assembly",
    "zh": "DVT1组装"
   },
   "start": {
    "en": "Plastic bodies throughout. Gas-line valves cut from three, keeping a separate H₂ valve.",
    "zh": "全部采用塑料阀体。气体管线阀门在3个的基础上减少，保留单独的氢气阀。"
   },
   "details": {
    "en": "Final valve list per line, with part numbers. For discussion, H₂ routing: H₂ could go into the mixing chamber, where it won't dissolve the way Cl₂ does. But a design where Cl₂ and H₂ meet as gases is a safety risk compared with using the chlorinated water to carry the H₂, as DVT1 does. H₂ and Cl₂ mixtures are flammable over a wide range, and the cells make the two gases one to one by mole. Reference: Chlorine Institute Pamphlet 121, Explosive Properties of Gaseous Mixtures Containing Hydrogen and Chlorine. The NB-16 gas-path review decides it.",
    "zh": "每条管线的最终阀门清单，含型号。待讨论的H₂走向：H₂可以接入混合腔，但它不会像Cl₂那样溶解。与DVT1用氯化水携带H₂的方式相比，让Cl₂和H₂以气体形式相遇的设计存在安全风险。H₂与Cl₂的混合气在很宽的浓度范围内可燃，而反应槽按摩尔比1:1产生这两种气体。参考：Chlorine Institute Pamphlet 121，Explosive Properties of Gaseous Mixtures Containing Hydrogen and Chlorine（含氢气和氯气的混合气体的爆炸特性）。由NB-16气路危害评审决定。"
   },
   "refine": {
    "en": "The final list follows NB-15b, NB-18b and the valve photos.",
    "zh": "最终清单根据NB-15b、NB-18b和阀门照片确定。"
   },

  {
   "id": "NB-82",
   "area": {
    "en": "Tank and water path",
    "zh": "水箱与水路"
   },
   "title": {
    "en": "IN and OUT tube that keeps its shape when a fitting is off-axis. Replaces the thin-wall PFA",
    "zh": "进水口和出水口改用在接头不对中时也不会压扁的管，替换薄壁PFA管"
   },
   "showed": {
    "en": "At Alex's install at the HASA test pool on 23 October, the PFA tube HSW selected for the IN and OUT taps collapsed wherever a fitting wasn't well aligned with it. DVT1 ships 14 × 16 mm tube, a 1 mm wall, on 16 mm compression fittings. On a pad the taps on the pool pipe seldom line up with the unit's bulkheads, so the tube has to bend near a fitting. A collapsed wall restricts the flow the hydraulic model counts on, at IN ahead of the booster and at OUT after the venturi.",
    "zh": "10月23日Alex在HASA测试泳池安装时，HSW选用的进水口和出水口PFA管只要接头没有对准就会被压扁。DVT1出货配的是14 × 16 mm管，壁厚1 mm，用16 mm卡套接头连接。在现场，泳池管道上的取水口很少能和设备的穿板接头对齐，管子只能在接头附近弯折。管壁压扁会限制水力模型所依据的流量：进水口在增压水泵之前，出水口在文丘里管之后。"
   },
   "evidence": {
    "en": "US field units",
    "zh": "美国现场设备"
   },
   "start": {
    "en": "Tube or hose at IN and OUT that stays round when it bends near a fitting or enters one off-axis, which means a thicker wall or a reinforced hose. Bore at least DVT1's 14 mm, since the hydraulic model, NB-14a, is built on that bore. In inch sizes per NB-12 that is ⅝ in ID or larger. Rated above the 260 kPa design line pressure from NB-14a at the water temperatures NB-29 sets, and for the booster's suction on the IN side. Wetted parts suited to chlorinated water and the caustic from drains, and UV-stable for an outdoor run.",
    "zh": "进水口和出水口采用在接头附近弯折或斜着插入接头时仍保持圆形截面的管或软管，即加厚管壁或带增强层的软管。内径不小于DVT1的14 mm，因为水力模型（NB-14a）按这个内径建立。按NB-12采用英制管时，即⅝ in内径或更大。额定压力高于NB-14a的260 kPa设计管路压力，按NB-29确定的水温考核，并能承受进水侧增压水泵的吸力。接液材料适用于含氯水和排碱带来的碱液，户外走管需耐紫外线。"
   },
   "details": {
    "en": "Tube or hose type, material, size and pressure rating. End fittings at the unit and at the pool-pipe tap, NPT per NB-12. Minimum bend radius. Whether the IN and OUT bulkheads move or change angle, or take swivel elbows, so a run leaves the cabinet toward the pad without a tight bend at the fitting.",
    "zh": "管或软管的类型、材料、尺寸和额定压力。设备端和泳池管道取水口端的接头，按NB-12采用NPT。最小弯曲半径。进水口和出水口穿板接头是否改变位置或角度，或加装旋转弯头，使管子出机柜后朝地面走，不在接头处急弯。"
   },

    "en": "Tap positions and run routing at each US pad, from the install photos. The hydraulic model's install-tubing loss for the chosen bore, NB-14a.",
    "zh": "各美国现场的取水口位置和走管方式，以安装照片为准。水力模型按所选内径计算的安装管路损失，见NB-14a。"

    "zh": "DVT1氯气混合装置由2 in PVC-U管、两个活接和四个变径接头胶粘而成。公差累积，组装困难，接合不良时可能泄漏氯气（M42）。目前唯一的检查是5月29日测试计划中的水循环目视检查，10台全部通过。没有气侧或压力泄漏测试。"

    "zh": "继续采用标准件，按HSW的短期对策（M42）采用机加工切管和熟练装配工。每个混合装置做压力或负压泄漏测试。不开模，除非某种模具成型结构能带来标准件无法实现的实际安全或效率提升。"

   },
   "showed": {
    "en": "DVT1 steel panels rust and their screw holes are badly misaligned (M14). The panel screws were slow to work with in field service and don't fit the ID. The steel also blocks Wi-Fi (E20). Dechen's 8 October signal test put the loss at about 5 dB, and a Fairview unit drops Wi-Fi once its metal panels are on (20 October call). Flat sheet metal can't carry the ID intent and adds weight.",
    "zh": "DVT1钢制面板生锈，螺丝孔严重错位（M14）。面板螺丝在现场维护时很不方便，也不符合ID设计。钢板还会屏蔽Wi-Fi信号（E20）。Dechen 10月8日的信号测试测得损失约5 dB，Fairview一台设备装上金属面板后Wi-Fi掉线（10月20日会议）。平板钣金无法实现ID设计意图，还增加重量。"
   },
   "evidence": {
    "en": "DVT1 assembly",
    "zh": "DVT1组装"
   },
   "start": {
    "en": "Vacuum-formed plastic for every exterior panel, ABS with an ASA cap layer per the forming vendor. Service panels on snap fits or captive thumbscrews, with the hardware counterbored flush. No visible screw heads on the front face, per Rev 3 item 7. The ID rework changes the panels anyway, and plastic helps Wi-Fi and any future LTE.",
    "zh": "所有外壳面板采用真空成型塑料，按成型供应商建议采用ABS加ASA表层。维护面板采用卡扣或不脱落手拧螺丝，紧固件处做沉孔，使其与表面齐平。按Rev 3第7项，正面不出现可见螺丝头。外观设计（ID）重做本来就要改面板，塑料也有利于Wi-Fi和今后可能采用的LTE。"
   },

  {
   "id": "NB-37",
   "area": {
    "en": "Pumps, flow and sensors",
    "zh": "水泵、流量与传感器"
   },
   "title": {
    "en": "Booster rated for continuous duty, speed-controlled, sized for pool pump shut-off",
    "zh": "增压泵：可24小时连续运行、可调速，按泳池泵关断压力选型"
   },
   "showed": {
    "en": "The DC55E-24160S is a fixed-speed model, and the board has no PWM pump output (E28). The probes only see flow while the unit generates, so ORP drifts in standby. SWC's hydraulic model puts the DVT1 venturi's limit at about 5.3 psi at the OUT tap, which typical pads pass above 1,900 to 2,600 rpm on a variable-speed pool pump.",
    "zh": "DC55E-24160S是定速型号，主板也没有PWM水泵输出（E28）。探头只有在设备制氯时才有水流经过，因此待机时ORP会漂移。SWC的综合水力模型给出DVT1文丘里管的限值约为OUT接口5.3 psi；典型现场的变频泳池泵转速超过约1,900至2,600 rpm时即超出该限值。"
   },
   "evidence": {
    "en": "EVT field units",
    "zh": "EVT现场设备"
   },
   "start": {
    "en": "Pump rated for 24/7 duty. Low speed in standby to keep water moving over the probes. When generating, the venturi keeps its vacuum at any pool pump speed, up to the pool pump's shut-off pressure of about 260 kPa at the OUT tap, so no cleaning or spa program pauses generation (Alex, 22 October). That takes about three times the DC55E's head at the needed flow, so expect a multistage or regenerative turbine pump, or stages in series. Generate speed set from the pool-line pressure, so the booster runs only as hard as the line needs.",
    "zh": "水泵额定可24/7连续运行。待机时低速运行，保持水流经过探头。制氯时，在任何泳池泵转速下文丘里管都须保持负压，直至泳池泵关断压力，即OUT接口处约260 kPa，因此任何清洁或按摩池程序都不会使制氯暂停（Alex，10月22日）。在所需流量下，这约为DC55E扬程的三倍，预计需要多级泵、旋涡泵或串联的多台水泵。制氯转速按泳池管路压力设定，使水泵只以管路所需的强度运行。"
   },
   "details": {
    "en": "Pump model with a speed input. Standby speed, and generate speed against line pressure. How the controller reads line pressure: a sensor on the IN side of the booster, or the venturi-inlet sensor read with the booster stopped. Power, heat and noise at each speed. Life at continuous duty. Pressure rating of the parts between the booster and the venturi. The minimum flow and head at generate speed come from the NB-14a venturi spec and follow its spec state.",
    "zh": "带调速输入的水泵型号。待机转速，以及随管路压力变化的制氯转速。控制器读取管路压力的方式：增压水泵IN侧的压力传感器，或在增压水泵停机时读取文丘里管进口压力传感器。各转速下的功率、发热和噪音。连续运行下的寿命。增压水泵与文丘里管之间零件的额定压力。制氯转速下的最低流量和扬程取自NB-14a的文丘里管规格，并随其规格状态更新。"

   },
   "showed": {
    "en": "The DVT1 firmware reports any current under 0.8 A as zero, so it can't confirm OFF (E22, E23). DVT1 already measures electrode voltage through an 11:1 divider and sends it over MQTT, but the screen shows it in whole volts. SWC's IO Function Description asks for cell impedance, from voltage and current, to judge electrode aging, with an alarm at 12 V. The firmware never computes it.",
    "zh": "DVT1固件把低于0.8 A的电流都报告为零，因此无法确认是否处于OFF状态（E22，E23）。DVT1已经通过11:1分压测量电极电压并通过MQTT发送，但屏幕只显示整数伏。SWC的IO功能说明要求根据电压和电流计算反应槽阻抗，用于判断电极老化，并在12 V时报警。固件从未计算该值。"

    "en": "HSW bench and rooftop pool",
    "zh": "HSW台架及楼顶泳池测试"
   },
   "start": {
    "en": "Current and voltage on each cell, measured off the main board, at a resolution that can track cell impedance and wear. HSW proposes an RS485 module (E22, E23).",
    "zh": "每个反应槽的电流和电压在主板之外测量，分辨率要足以跟踪反应槽阻抗和磨损。HSW建议采用RS485模块（E22，E23）。"
   },

   "title": {
    "en": "Hard stop independent of firmware",
    "zh": "用户可触及的急停，独立于固件切断电解电源"
   },
   "showed": {
    "en": "With the firmware down after an interrupted OTA on Urim's unit, the board drove the cells at full power, with a boiling sound and chlorine smell in under two minutes (26 August). Nothing lets an owner cut the cells instantly. The retrofit SSRs sit in the AC feed to each cell supply, after the breaker, each on its own board pin. An SSR that fails shorted keeps conducting with no control signal.",
    "zh": "Urim的设备在OTA中断后固件宕机，主板以全功率驱动反应槽，不到两分钟就出现沸腾声和氯气味（8月26日）。目前没有任何手段能让用户立即切断电解。改装的SSR装在每个电解电源的交流进线上，位于断路器之后，各由主板上的一个引脚控制。SSR如果短路失效，即使没有控制信号也会继续导通。"
   },
   "evidence": {
    "en": "Urim's pool",
    "zh": "Urim的泳池"
   },
   "start": {
    "en": "An E-stop button or switch that is easy to reach. Pressing it cuts the control signal to the cell SSRs and also opens the AC feed to the cell supplies. The electrode supplies lose power whatever the firmware is doing, even if an SSR has failed shorted.",
    "zh": "一个容易触及的急停按钮或开关。按下后切断电解SSR的控制信号，同时断开电解电源的交流进线。无论固件处于什么状态，即使某个SSR已短路失效，电极电源都会断电。"
   },
   "details": {
    "en": "Switch type and rating, position, how it resets. Whether it also tells the board, so the firmware logs it. The SSR control voltage, measured on a unit, since the records give 12 V, 3.3 V and 2.4 to 2.5 V.",
    "zh": "开关类型和额定值、位置、复位方式。是否同时通知主板，以便固件记录。在设备上实测SSR控制电压，因为各记录给出的值有12 V、3.3 V和2.4~2.5 V。"

    "zh": "控制器平台：独立主控模块，可用于其他设备"
   },
   "showed": {
    "en": "Weak Wi-Fi and the external RS485 expansion module on DVT1 led HSW to propose an ESP32-C5 CoreBoard with an expansion board (E20, E21). HASA asked in January for a modular brain and body, with the controls running independently of generation. HASA also asked for relays to power peristaltic feed pumps for chlorine, acid and two specialty chemicals, and for memory to spare.",
    "zh": "由于DVT1的Wi-Fi信号弱且使用外置RS485扩展模块，HSW提出采用ESP32-C5 CoreBoard加扩展板的方案（E20，E21）。HASA在1月提出采用模块化的主控与机体分离设计，控制部分独立于制氯部分运行。HASA还要求提供继电器，用于驱动氯、酸和两种特殊化学品的蠕动加药泵，并预留存储空间。"

    "zh": "HSW台架及楼顶泳池测试"

   "start": {
    "en": "The brain is a separate module that can run other equipment, such as acid and chlorine feed pumps, split from the generator's power and controls. Modules talk to it over a wired bus, and SWC proposes CAN. Decide with Urim before electrical layout. IO for the variable-speed pump, pool-pump current input, level sensors, current module and relays.",
    "zh": "主控是一个独立模块，可以控制其他设备（例如酸和氯加药泵），与制氯机的电源和控制部分分开。各模块通过有线总线与主控通信，SWC建议采用CAN。在电气布局前与Urim共同确定。IO需覆盖调速泵、泳池循环泵电流输入、液位传感器、电流检测模块和继电器。"

   "title": {
    "en": "Pre-certified radio, antenna placed for plastic panels, Ethernet port as wired backup",
    "zh": "使用已获FCC认证的无线模块，天线按塑料外壳布置，面板上设以太网口作有线备用"
   },
   "showed": {
    "en": "DVT1 uses an off-the-shelf antenna behind steel, and Wi-Fi is its only path. A Fairview unit loses Wi-Fi with its metal panels on, and one Phoenix pad has no site Wi-Fi. The DVT1 board has unused provisions for Ethernet (W5500 to RJ45, J6) and an LTE module (J7). The LAN module wasn't fitted, and the firmware has no Ethernet driver.",
    "zh": "DVT1使用现成天线，装在钢板后面，且Wi-Fi是唯一的通信方式。Fairview的一台设备装上金属面板后Wi-Fi断开，Phoenix有一个设备区没有现场Wi-Fi。DVT1主板上有未使用的以太网（W5500至RJ45，J6）和LTE模块（J7）预留。LAN模块没有贴装，固件也没有以太网驱动。"

   "id": "NB-56",
   "area": {
    "en": "Electrical, controller and display",
    "zh": "电气、控制器与屏幕"
   },
   "title": {
    "en": "Mains entry, grounding and bonding to UL 1081",
    "zh": "市电进线、接地和等电位连接按UL 1081设计"
   },
   "showed": {
    "en": "The DVT1 mains cord entry is the wrong size (M06), and the control box needs a better ground (M08).",
    "zh": "DVT1的市电进线口尺寸不对（M06），控制箱需要更好的接地（M08）。"
   },
   "evidence": {
    "en": "DVT1 assembly",
    "zh": "DVT1组装"
   },
   "start": {
    "en": "Bonding and grounding to UL 1081, the standard for electrolytic chlorinators. Clauses from the 7th edition: an accessible bonding connector (1.3). A grounding terminal in the field-wiring compartment for 12 AWG copper or larger, with a green screw or marked G, GR or Ground, and no sheet-metal screws (14.2.1). Every accessible metal part that could become live bonded to ground (14.4.1.1). An external copper or copper-alloy lug for 8 AWG solid copper to the pool bonding grid (14.5.1, 14.5.2). Grounding path 0.1 Ω or less at 30 A or more (14.3.3, 37.1). A grounding electrode in the water at inlet and outlet, factory bonding of the cell enclosure and electrodes, or proof of 1 mA or less from water to ground (32.1 to 32.4). Dielectric test 2500 V primary to secondary, 500 V secondary to dead metal (Table 39.2). Install text calling for 8 AWG solid copper from the lug to the bonding grid (55.3). Cord entry sized to fix M06.",
    "zh": "等电位连接和接地按UL 1081设计，该标准适用于电解式氯发生器。以下条款出自第7版：可接触的等电位连接端子（1.3）。现场接线腔内设接地端子，可接12 AWG或更粗的铜线，采用绿色螺丝或标G、GR或Ground，不得使用钣金自攻螺丝（14.2.1）。所有可能带电的可接触金属件都要接地（14.4.1.1）。外部设铜或铜合金接线端子，可接8 AWG实心铜线，连到泳池等电位网（14.5.1，14.5.2）。接地路径在30 A或以上时电阻不超过0.1 Ω（14.3.3，37.1）。在进水口和出水口的水中设接地电极，或在工厂将反应槽外壳和电极做等电位连接，或证明水对地电流不超过1 mA（32.1至32.4）。耐压测试：一次侧对二次侧2500 V，二次侧对不带电金属500 V（表39.2）。安装说明要求用8 AWG实心铜线从接线端子连到等电位网（55.3）。市电进线口尺寸改正，解决M06。"
   },
   "details": {
    "en": "Confirm the clauses against the 8th edition, published 28 October 2025, which may renumber them. UL 1081 clause 43 also tests abnormal operation with excess electrolyte and with flow on and off, which bears on the standby-gassing fault. Certification scope in NB-78.",
    "zh": "对照2025年10月28日发布的第8版核对条款，第8版可能重新编号。UL 1081第43条还测试电解液过量以及水流通断时的异常运行，这与待机产气故障有关。认证范围见NB-78。"

   "showed": {
    "en": "The DVT1 display is small, sits low and is bonded in, so it is hard to replace (E29, M03). Screen OTA works on DVT1 but still fails sometimes. It first worked on 4 September, then failed on 7, 9 and 21 September.",
    "zh": "DVT1屏幕尺寸小、安装位置偏低，且为胶粘固定，因此难以更换（E29，M03）。DVT1的屏幕OTA可以用，但有时仍会失败。9月4日首次成功，之后在9月7日、9日和21日失败过。"

   "start": {
    "en": "Pick a screen that meets the 16 June display spec. The screen updates over the air, so it needs no SD card access. It tilts less than Rev 3's 15°, with the angle set from a sightline mockup at the final mounting height, so it points less toward the sky.",
    "zh": "选择符合6月16日屏幕规格的屏幕。屏幕通过OTA升级，因此不需要SD卡接口。屏幕倾角小于Rev 3的15°，角度根据最终安装高度下的视线样机确定，使屏幕不那么朝向天空。"

    "en": "Key numbers in the 16 June spec: 10.1 in IPS, 1280 × 800 (1024 × 600 fallback), optically bonded. 800 nits minimum, 1000 target, AR and AF coating, UV-stable. PCAP touch, 5 points or more, with water rejection. −20 to +70 °C operating, 5 to 95% RH. Front sealable to IP65. A smart module over UART at 3.3 V, or a MIPI-DSI panel on an ESP32-P4. Host-pushed OTA. Screen OTA reliability belongs with the firmware rows, NB-68.",
    "zh": "6月16日规格的关键参数：10.1寸IPS，1280 × 800（备选1024 × 600），全贴合。最低800 nits，目标1000 nits，AR和AF镀膜，耐UV。PCAP电容触摸，5点或以上，防水误触。工作温度−20至+70 °C，湿度5%~95% RH。正面可密封到IP65。UART 3.3 V智能模块，或由ESP32-P4驱动的MIPI-DSI屏。主机推送OTA。屏幕OTA的可靠性归入固件项，见NB-68。"

   "start": {
    "en": "Drain at every automated end and about every 2 h of cells-on time, 10 min to start, both settable over MQTT. Alex's working plan from the 20 October call is 5 to 10 min every 1 to 2 h. HSW's 16 October Plan B ends a drain on level instead, when level sensors B and C drop out. DVT1's level sensors can already do that, since they read the level both chambers share.",
    "zh": "每次自动运行结束时排碱，并且电解运行时间每累计约2 h排碱一次，起始值10 min，间隔和时长均可通过MQTT设置。Alex在10月20日电话会上的暂定方案是每1至2 h排碱5至10 min。HSW 10月16日的方案B改为按液位结束排碱，即液位传感器B和C脱离液面时结束。DVT1的液位传感器已经可以做到，因为它们测的是两个腔共用的液位。"

    "en": "HSW's 16 October heights, measured from the tank floor: brine overflow 62 cm, external caustic port 57.2 cm, internal connection between the chambers 49.5 cm. So one drain through the port lowers both chambers by 4.8 cm. DVT1 brine ran above pH 10 after about 10 h (Risk 2, M32).",
    "zh": "HSW 10月16日给出的高度（从水箱底面量起）：盐水溢流口62 cm，外部碱液排放口57.2 cm，两腔之间的内部连通口49.5 cm。因此经排放口排碱一次，两个腔的液位都下降4.8 cm。DVT1的盐水运行约10 h后pH超过10（风险2，M32）。"

    "zh": "老化测试V3.0的排碱阶段，并对排出液和主体盐水做滴定对比。主测试完成后，HSW在现有排放口内侧加装一个90°弯头作为吸管，进行对比（10月20日已商定）。在HASA测试泳池和现场设备上开启自动排碱，观察泳池pH趋势。"

    "zh": "在DVT1排放口高度排碱，无法将盐水pH维持在目标值，且弯头进口每次排出的量有可测出的增加。盐水pH目标值：TBD, Alex（待 Alex 确定）。V3.0规定盐水pH达到11时停止测试。"

   "title": {

    "zh": "DVT2水箱液位传感器位置"
   },
   "know": {
    "en": "DVT1 has four XKC-Y29A level sensors on inputs P14 to P17, mounted on the caustic chamber. The chambers connect inside the tank at 49.5 cm, below the 57.2 cm caustic port and the 62 cm overflow. So the four sensors read the level both chambers share, and the firmware calls it \"alkali level\". No build drains on its own yet. The 19 October operating-states spec drains on a timer by choice.",
    "zh": "DVT1在输入P14至P17上接有4个XKC-Y29A液位传感器，装在碱液腔上。两个腔在水箱内部49.5 cm处连通，低于57.2 cm的碱液排放口和62 cm的溢流口。因此这4个传感器测的是两个腔共用的液位，固件把它称为“alkali level”。目前还没有任何版本能自动排碱。10月19日的运行状态规范选择按定时排碱。"
   },
   "dont": {
    "en": "The measured sensor heights (operating-states spec O5). The lowest safe level once the NB-05 dip tube is in, since a lower intake allows a lower low level. If DVT2 separates the chambers, for example by raising the internal connection above the overflow as HSW suggested on 16 October, each chamber needs its own sensing.",
    "zh": "传感器的实测高度（运行状态规范O5）。装上NB-05吸管后的最低安全液位，因为吸液口更低，允许的低液位也更低。如果DVT2把两个腔分开（例如按HSW 10月16日的设想，把内部连通口抬高到溢流口以上），每个腔都需要单独的液位检测。"
   },
   "test": {
    "en": "HSW's photo of a DVT1 tank with the sensor heights measured (O5), plus the NB-05 dip-tube result after the aging run.",
    "zh": "HSW对一台DVT1水箱拍照并实测传感器高度（O5），加上老化测试后NB-05吸管测试的结果。"
   },
   "vehicle": {
    "en": "Aging test V3.0",
    "zh": "老化测试V3.0"
   },
   "go": {
    "en": "The measured heights or the dip-tube result show the DVT1 positions don't cover the levels DVT2 needs. Then move the sensors to the heights the result sets.",
    "zh": "实测高度或吸管测试结果表明，DVT1的传感器位置覆盖不了DVT2需要的液位。则按结果确定的高度移动传感器。"

   "know": {
    "en": "DVT1 cancelled the brine pump because its stainless shaft corrodes, and relies on salt diffusion and electrolysis convection. HSW proposes a corrosion-proof pump such as a peristaltic (E30), placed clear of the tank inlet (M02).",
    "zh": "DVT1因盐水泵的不锈钢轴会腐蚀而取消了该泵，改为依靠盐的扩散和电解产生的对流。HSW建议采用耐腐蚀的泵，例如蠕动泵（E30），安装位置避开水箱进口（M02）。"
   },
   "dont": {

    "zh": "没有泵时盐水上下是否保持均匀，以及产氯量是否受其影响。"

    "zh": "在一台DVT1设备上测试盐水上下均匀性（上部对比底部）和产氯量稳定性。老化测试V3.0中尚未包含此项，需要补充。"

   "vehicle": {

   "know": {
    "en": "The EVT 1 inlet check valve backflowed (M35), and HSW found the DVT1 valve's cracking pressure too high (M19). The DVT1 and demo venturis share internal geometry and differ in the check valve spring and diaphragm (M37).",
    "zh": "EVT 1的进口止回阀出现倒流（M35），HSW发现DVT1止回阀的开启压力过高（M19）。DVT1和Demo样机的文丘里管内部几何尺寸相同，区别在于止回阀弹簧和膜片（M37）。"

    "zh": "HSW台架测试：止回阀拆解、开启压力测量，以及文丘里管在有膜片和无膜片两种状态下的运行对比（M19，M35，M37）。"

   "title": {

   },
   "know": {
    "en": "No valve reports its position, so a stuck B or D goes unseen (DFMEA 3, DFMEA 5). HSW suggests passive PTFE check valves. The operating-states spec needs both motorized today: B closes outside generation so the venturi pulls on D, and D opens only to drain. Records disagree on whether DVT1's gas-line valves were cut from three to one, and valve photos will settle it (NB-15a).",
    "zh": "所有阀门都没有位置反馈，因此电动球阀B或D卡死时无法发现（DFMEA 3，DFMEA 5）。HSW建议改为被动式PTFE止回阀。按目前的运行状态规范，两个阀都必须是电动的：非制氯时B关闭，使文丘里管的吸力作用在D上；D仅在排放时打开。对于DVT1的气体管线阀门是否已从3个减为1个，各记录说法不一，阀门照片可以确认（NB-15a）。"
   },
   "dont": {

    "zh": "电动球阀B和D在实际使用中卡死的频率。"
   },
   "test": {

    "zh": "在老化测试期间和现场，观察B和D的卡死情况和运行稳定性。"
   },
   "vehicle": {
    "en": "Aging test V3.0",

   },
   "go": {
    "en": "B or D sticks in service, and the operating-states spec can be met with passive valves.",

    "en": "DVT1 relies on outdoor siting alone. The EVT 4 booster failure vented chlorine into an indoor equipment room, and standby current gassed the salt tank on US units. HSW picked RS-485 gas alarms for the aging run (20 October).",
    "zh": "DVT1仅依靠户外安装。EVT 4增压水泵故障时，氯气泄入室内设备间；美国设备上的待机电流使盐水箱内产生气体。HSW已为老化测试选定RS-485气体报警器（10月20日）。"

   "know": {
    "en": "Nobody has tested an operating limit. Abnormal-condition testing hasn't run, and HSW plans the extreme tests after aging (8 October). Aging V3.1 logs ambient temperature and humidity but tests no limit. The only numbers on record are component ratings: the FH-S valves and the pH and EC probes are rated −5 to 45 °C. HSW found the screen at risk in outdoor heat without a cover (Merged 3).",
    "zh": "还没有人测试过任何运行限值。异常工况测试还没有进行，HSW计划在老化测试之后做极端测试（10月8日）。老化测试V3.1记录环境温度和湿度，但不测试任何限值。记录中仅有的数据是零件额定值：FH-S阀门以及pH和EC探头的额定温度为−5至45 °C。HSW发现，没有遮挡时屏幕在户外高温下有风险（汇总问题3）。"

   "know": {
    "en": "In OFF, DVT1 units showed 0.918 A and 0.631 A on the cells (E22). HSW's cause column says the circuit was confirmed off and the readings come from poor measurement accuracy. The US units still gassed the salt tank in OFF from a sub-amp leak, and the DVT1 board reads anything under 0.8 A as zero. NB-48 moves current sensing off the main board at about 0.1 A or better.",
    "zh": "处于OFF（关机状态）时，DVT1设备屏幕显示反应槽电流为0.918 A和0.631 A（E22）。HSW的原因栏写明电路已确认完全断开，这些读数是测量精度不足造成的。美国设备在OFF状态下仍因亚安培级漏电在盐水箱内产气，而DVT1主板把低于0.8 A的电流都读为零。NB-48将电流检测移到主板之外，分辨率约0.1 A或更高。"
   },

 "readme": [
  {
   "style": "title",
   "label": {
    "en": "HCG-50 DVT2 design change tracker",
    "zh": "HCG-50 DVT2设计变更跟踪表"
   },
   "text": {
    "en": "",
    "zh": ""
   }
  },
  {
   "style": "",
   "label": {
    "en": "Version",
    "zh": "版本"
   },
   "text": {
    "en": "V1.4",
    "zh": "V1.4"
   }
  },
  {
   "style": "",
   "label": {
    "en": "Date",
    "zh": "日期"
   },
   "text": {
    "en": "24 October 2026",
    "zh": "2026年10月24日"
   }
  },
  {
   "style": "",
   "label": {
    "en": "Prepared by",
    "zh": "编制"
   },
   "text": {
    "en": "Standard Water Corp (SWC), Alex Valeyev",
    "zh": "Standard Water Corp（SWC），Alex Valeyev"
   }
  },
  {
   "style": "",
   "label": {
    "en": "Purpose",
    "zh": "目的"
   },
   "text": {
    "en": "This workbook lists every design change planned for DVT2, the 20-unit build, and sorts each one by whether it can start now or has to wait for test data. DVT1 is the ten units HSW built in May to July 2026. The NB IDs are the same as in SWC's 20 October design-issue list, so a row here and an item there always refer to the same change. It answers the 20 October call: known changes on one sheet, test-dependent ones on another.",
    "zh": "本工作簿列出DVT2（即20台批次）计划的全部设计变更，并按能否现在开始、还是必须等待测试数据进行分类。DVT1是指HSW在2026年5月至7月制造的10台设备。NB编号与SWC 10月20日设计问题清单中的编号一致，因此本表中的一行与该清单中的一项始终对应同一个变更。本表回应10月20日电话会议的要求：已知变更列在一张表中，依赖测试的变更列在另一张表中。"
   }
  },
  {
   "style": "",
   "label": {
    "en": "Language",
    "zh": "语言"
   },
   "text": {
    "en": "Every cell has English on top and Chinese below in blue. Dropdown values carry both languages on one line.",
    "zh": "每个单元格上方为英文，下方为蓝色中文。下拉选项在同一行内同时显示中英文。"
   }
  },
  {
   "style": "sub",
   "label": {
    "en": "The rule",
    "zh": "规则"
   },
   "text": {
    "en": "",
    "zh": ""
   }
  },
  {
   "style": "",
   "label": {
    "en": "Go now",
    "zh": "立即执行"
   },
   "text": {
    "en": "What DVT1 has already shown justifies starting the change, even if the detailed design isn't decided. That evidence comes from DVT1 assembly in Shenzhen, HSW's bench and rooftop pool runs, Urim's pool, the US field units and the EVT units. A change whose direction is decided but whose numbers come from later data is still Go now. The data that refines it has its own column.",
    "zh": "DVT1 已经暴露的问题足以支持现在就开始这项变更，即使详细设计还没有确定。依据来自深圳的 DVT1 组装、HSW 台架和楼顶泳池测试、Urim 的泳池、美国现场设备和 EVT 现场设备。方向已定、但具体数值要等后续数据的变更，仍属于立即执行，所需数据单独列在一栏。"
   }
  },
  {
   "style": "",
   "label": {
    "en": "Needs testing",
    "zh": "需要测试"
   },
   "text": {
    "en": "We don't yet know whether the change is needed, or which way it should go. The go or no-go waits on the aging test, the HASA test pool, more field time or a specific bench test. Each row gives a hold position: the design DVT2 carries until the decision, so the layout isn't blocked. No hold position adds a threaded port below the liquid line.",
    "zh": "目前还不知道这项变更是否需要，或者应该往哪个方向改。是否执行要等老化测试、HASA 测试泳池、更多现场运行或专项台架测试的结果。每一行都给出过渡方案，即决定之前 DVT2 设计先按此方案布置，整体布局不必等待。任何过渡方案都不得在液位以下增加螺纹接口。"
   }
  },
  {
   "style": "sub",
   "label": {
    "en": "Sheets",
    "zh": "工作表"
   },
   "text": {
    "en": "",
    "zh": ""
   }
  },
  {
   "style": "",
   "label": {
    "en": "Go now",
    "zh": "立即执行"
   },
   "text": {
    "en": "68 changes to start now.",
    "zh": "68项可立即开始的变更。"
   }
  },
  {
   "style": "",
   "label": {
    "en": "Needs testing",
    "zh": "需要测试"
   },
   "text": {
    "en": "15 changes waiting on a test, each with its hold position.",
    "zh": "15项等待测试的变更，每项都有过渡方案。"
   }
  },
  {
   "style": "",
   "label": {
    "en": "Test gates",
    "zh": "测试关口"
   },
   "text": {
    "en": "One row per test vehicle: what it is, which unit, timing as the records state it, which Needs-testing rows it decides, and what it must measure that its plan doesn't cover yet. Includes the output test (NB-75) and the abnormal-condition tests (NB-76).",
    "zh": "每个测试载体一行：内容、所用设备、记录中的时间安排、决定需要测试 (Needs testing) 表中的哪些行，以及必须测量但计划尚未覆盖的项目。包括产氯量测试（NB-75）和异常工况测试（NB-76）。"
   }
  },
  {
   "style": "",
   "label": {
    "en": "Summary",
    "zh": "汇总"
   },
   "text": {
    "en": "Counts by area and category, and by status. Formulas, so they update as rows change.",
    "zh": "按领域和类别、以及按状态统计数量。使用公式，行内容变化时自动更新。"
   }
  },
  {
   "style": "sub",
   "label": {
    "en": "Go now columns",
    "zh": "立即执行表各列"
   },
   "text": {
    "en": "",
    "zh": ""
   }
  },
  {
   "style": "",
   "label": {
    "en": "ID",
    "zh": "编号"
   },
   "text": {
    "en": "NB number from the 20 October design-issue list. A suffix, such as NB-14a and NB-14b, means one item split between the two sheets. NB-09b is a new row added in V1.1. NB-81 and NB-82 are new in V1.4 and take the next numbers after that list.",
    "zh": "10月20日设计问题清单中的NB编号。带后缀的编号（如NB-14a和NB-14b）表示同一项拆分到两张表中。NB-09b是V1.1新增的一行。NB-81和NB-82是V1.4新增的两行，编号接在该清单之后。"
   }
  },
  {
   "style": "",
   "label": {
    "en": "Area",
    "zh": "领域"
   },
   "text": {
    "en": "One of eight: Tank and water path, Gas path and safety, Enclosure and materials, Weight, layout and ID, Pumps, flow and sensors, Electrical, controller and display, Firmware and controls, Validation and documentation.",
    "zh": "共八类：水箱与水路；气路与安全；外壳与材料；重量、布局与外观设计；水泵、流量与传感器；电气、控制器与屏幕；固件与控制；验证与文档。"
   }
  },
  {
   "style": "",
   "label": {
    "en": "Design change",
    "zh": "设计变更"
   },
   "text": {
    "en": "The change itself.",
    "zh": "变更内容本身。"
   }
  },
  {
   "style": "",
   "label": {
    "en": "What DVT1 showed",
    "zh": "DVT1暴露的问题"
   },
   "text": {
    "en": "The finding that justifies the change. EVT and design-review findings are named where they are the source.",
    "zh": "支持该变更的发现。如果来源是EVT或设计评审，会注明。"
   }
  },
  {
   "style": "",
   "label": {
    "en": "Evidence",
    "zh": "依据来源"
   },
   "text": {
    "en": "The main source: DVT1 assembly, HSW bench and rooftop pool, Urim's pool, US field units, EVT field units or Design review. Other sources are named in What DVT1 showed.",
    "zh": "主要来源：DVT1组装、HSW台架及楼顶泳池测试、Urim的泳池、美国现场设备、EVT现场设备或设计评审。其他来源在DVT1暴露的问题 (What DVT1 showed) 一栏中注明。"
   }
  },
  {
   "style": "",
   "label": {
    "en": "What can start now",
    "zh": "现在可以开始的工作"
   },
   "text": {
    "en": "The requirement HSW can design to today.",
    "zh": "HSW现在就可以据此开展设计的要求。"
   }
  },
  {
   "style": "",
   "label": {
    "en": "Details still to define",
    "zh": "待定细节"
   },
   "text": {
    "en": "Numbers, parts or methods not yet decided.",
    "zh": "尚未确定的数值、零件或方法。"
   }
  },
  {
   "style": "",
   "label": {
    "en": "Data that refines the details",
    "zh": "用于细化的数据"
   },
   "text": {
    "en": "The test or field data that will set those numbers. It doesn't hold the change back.",
    "zh": "用于确定这些数值的测试或现场数据。变更不必等待这些数据。"
   }
  },
  {
   "style": "",
   "label": {
    "en": "HSW ref",
    "zh": "HSW编号"
   },
   "text": {
    "en": "HSW's IDs from the 13 October workbook: E and M rows of the Total Issue List, Risk 1 to 7, Merged 1 to 10 (rows of the Infied Issue List tab), DFMEA 1 to 17, and Jira tickets where HSW listed them.",
    "zh": "HSW 10月13日工作簿中的编号：总问题清单中的E行和M行，风险1至7，汇总问题1至10（问题汇总表中的行），DFMEA 1至17，以及HSW列出的Jira工单。"
   }
  },
  {
   "style": "",
   "label": {
    "en": "Owner",
    "zh": "负责人"
   },
   "text": {
    "en": "HSW's own assignment where an HSW row exists. Blank means HSW to assign.",
    "zh": "如有对应的HSW条目，沿用HSW自己的分配。空白表示由HSW指定。"
   }
  },
  {
   "style": "",
   "label": {
    "en": "Status, Target date, HSW comments",
    "zh": "状态、目标日期、HSW意见"
   },
   "text": {
    "en": "For HSW to fill in.",
    "zh": "由HSW填写。"
   }
  },
  {
   "style": "sub",
   "label": {
    "en": "Needs testing columns",
    "zh": "需要测试表各列"
   },
   "text": {
    "en": "",
    "zh": ""
   }
  },
  {
   "style": "",
   "label": {
    "en": "What we know / don't know",
    "zh": "已知情况 / 未知情况"
   },
   "text": {
    "en": "The evidence so far, and the open question the test has to answer.",
    "zh": "目前已有的证据，以及测试需要回答的未决问题。"
   }
  },
  {
   "style": "",
   "label": {
    "en": "Test that decides it",
    "zh": "决定性测试"
   },
   "text": {
    "en": "The test, and where it runs.",
    "zh": "测试内容及测试地点。"
   }
  },
  {
   "style": "",
   "label": {
    "en": "Test vehicle",
    "zh": "测试载体"
   },
   "text": {
    "en": "The main vehicle: Aging test V3.0, HASA test pool, US field units, Urim's pool, HSW bench test or Gas-path review.",
    "zh": "主要测试载体：老化测试V3.0、HASA测试泳池、美国现场设备、Urim的泳池、HSW台架测试或气路评审。"
   }
  },
  {
   "style": "",
   "label": {
    "en": "Go if / No-go if",
    "zh": "执行条件 / 不执行条件"
   },
   "text": {
    "en": "The decision criteria. Numbers come from the records: the aging V3.0 stop-gates, DFMEA 17 (parts under 60 °C) and the 4.4 ppm output spec. TBD, Alex marks a number no record gives yet. SWC will set it.",
    "zh": "判定标准。数值取自现有记录：老化测试V3.0的停机判据、DFMEA 17（零件温度低于60 °C）和4.4 ppm产氯量规格。标为TBD, Alex（待 Alex 确定）的数值目前没有记录可依，将由SWC确定。"
   }
  },
  {
   "style": "",
   "label": {
    "en": "DVT2 hold position",
    "zh": "DVT2过渡方案"
   },
   "text": {
    "en": "What the DVT2 design carries until the decision.",
    "zh": "决定之前DVT2设计采用的方案。"
   }
  },
  {
   "style": "",
   "label": {
    "en": "Decision needed by",
    "zh": "需在此之前决定"
   },
   "text": {
    "en": "The design step that has to wait for the decision. It names a step, not a date.",
    "zh": "需要等待该决定的设计步骤。填写的是步骤，不是日期。"
   }
  },
  {
   "style": "sub",
   "label": {
    "en": "Status values",
    "zh": "状态选项"
   },
   "text": {
    "en": "",
    "zh": ""
   }
  },
  {
   "style": "",
   "label": {
    "en": "Go now",
    "zh": "立即执行"
   },
   "text": {
    "en": "Not started: nobody is working the change yet. In design: details being worked out. Decided: details settled, not yet in the DVT2 CAD, BOM or firmware. In DVT2 design: in the DVT2 CAD, BOM or firmware. Dropped: not carried into DVT2, with the reason in HSW comments. Awaiting HASA confirmation: direction drafted, HASA has to confirm. Needs discussion: SWC wants the row talked through before anyone designs it.",
    "zh": "未开始 (Not started)：还没有人处理该变更。设计中 (In design)：正在确定细节。已确定 (Decided)：细节已确定，但尚未纳入DVT2的CAD、BOM或固件。已纳入DVT2设计 (In DVT2 design)：已纳入DVT2的CAD、BOM或固件。已取消 (Dropped)：不带入DVT2，原因写在HSW意见 (HSW comments) 中。待HASA确认 (Awaiting HASA confirmation)：方向已草拟，需HASA确认。待讨论 (Needs discussion)：SWC希望在设计之前先讨论该行。"
   }
  },
  {
   "style": "",
   "label": {
    "en": "Needs testing",
    "zh": "需要测试"
   },
   "text": {
    "en": "Waiting on test: the deciding test hasn't started. Test running: it has started. Decided go: the change goes into DVT2 and moves to Go now in the next version. Decided no-go: the hold position becomes the DVT2 design. Needs discussion: SWC wants the row talked through before the test is set.",
    "zh": "等待测试 (Waiting on test)：判定测试尚未开始。测试中 (Test running)：测试已开始。决定执行 (Decided go)：变更纳入DVT2，并在下一版本中移到立即执行 (Go now) 表。决定不执行 (Decided no-go)：过渡方案成为DVT2的正式设计。待讨论 (Needs discussion)：SWC希望在确定测试之前先讨论该行。"
   }
  },
  {
   "style": "",
   "label": {

    });
    $("#filters").hidden = !(k === "go" || k === "nt" || k === "summary");
    $("#fe").closest(".f").hidden = k === "nt";
    store.set("tab", k);
    if (push !== false) setHash(k);
    refresh();
  }
  function refresh() {
    let shown = 0, total = 0;
    if (tab === "go") { shown = renderGo(); total = D.go.length; }
    else if (tab === "nt") { shown = renderNt(); total = D.nt.length; }
    else if (tab === "summary") { shown = renderSummary(); total = D.go.length + D.nt.length; }
    $("#count").textContent = (tab === "go" || tab === "nt" || tab === "summary") ? ("Showing " + shown + " of " + total + " · 显示 " + shown + " / " + total) : "";
  }
  $("#tabs").addEventListener("click", (e) => { const b = e.target.closest("[data-tab]"); if (b) showTab(b.dataset.tab); });
  $("#tabs").addEventListener("keydown", (e) => {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    const i = TABS.findIndex((t) => t.key === tab);
    const n = TABS[(i + (e.key === "ArrowRight" ? 1 : TABS.length - 1)) % TABS.length].key;
    showTab(n); $("#t-" + n).focus();
  });
  function setLang(l) {
    document.body.dataset.lang = l;
    document.querySelectorAll("#langseg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === l)));
    store.set("lang", l);
  }
  $("#langseg").addEventListener("click", (e) => { const b = e.target.closest("button[data-lang]"); if (b) setLang(b.dataset.lang); });

  // row open + in-text links
  document.addEventListener("click", (e) => {
    const a = e.target.closest("a[data-row], a[data-tab]");
    if (a) {
      e.preventDefault();
      if (a.dataset.row) { const r = ROWS[a.dataset.row]; if (r) { if (tab !== r.sheet && !current) showTab(r.sheet, false); openRow(r.id); } }
      else { closeRow(); showTab(a.dataset.tab); }
      return;
    }
    if (e.target.closest("a")) return;
    const tr = e.target.closest("tr[data-open]");
    if (tr) openRow(tr.dataset.open);
  });
  document.addEventListener("keydown", (e) => {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("tr[data-open]")) { e.preventDefault(); openRow(e.target.dataset.open); }
  });

  // filters
  let qTimer = null;
  $("#q").addEventListener("input", (e) => { clearTimeout(qTimer); qTimer = setTimeout(() => { F.q = e.target.value.trim(); refresh(); }, 120); });
  [["#fa", "area"], ["#fe", "ev"], ["#fs", "st"], ["#fo", "owner"]].forEach(([s, k]) => $(s).addEventListener("change", (e) => { F[k] = e.target.value; refresh(); }));
  $("#clear").addEventListener("click", () => {
    Object.keys(F).forEach((k) => { F[k] = ""; });
    ["#q", "#fa", "#fe", "#fs", "#fo"].forEach((s) => { $(s).value = ""; });
    refresh();
  });
  $("#ftoggle").addEventListener("click", () => {
    const fl = $("#filters"); const c = fl.classList.toggle("collapsed");
    $("#ftoggle").setAttribute("aria-expanded", String(!c));
  });

  // boot
  renderReadme(); renderGates(); renderRefs();
  setLang(["en", "zh", "both"].includes(store.get("lang")) ? store.get("lang") : "both");
  function fromHash() {
    const h = (location.hash || "").replace(/^#/, "");
    if (ROWS[h]) { showTab(ROWS[h].sheet, false); openRow(h, false); return true; }
    if (TABS.some((t) => t.key === h)) { showTab(h, false); return true; }
    return false;
  }
  if (!fromHash()) showTab(store.get("tab") || "go", false);
  window.addEventListener("hashchange", () => { if (current && location.hash === "#" + current.id) return; if (current) { current = null; $("#drawer").hidden = true; $("#scrim").hidden = true; document.body.style.overflow = ""; } fromHash(); });
})();
</script>
